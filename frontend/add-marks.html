<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add Marks - Examination Portal</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="portal-wrapper">

<aside class="sidebar">

<div class="brand">

<div class="brand-logo">
UE
</div>

<div>

<h5>
Examination Portal
</h5>

<small>
Marks Management
</small>

</div>

</div>

<nav class="sidebar-nav">

<a
href="index.html"
class="nav-link">

<i class="bi bi-grid-1x2"></i>
Dashboard

</a>

<a
href="students.html"
class="nav-link active">

<i class="bi bi-people"></i>
Students

</a>

</nav>


<div class="sidebar-bottom">

<a
href="classes.html"
class="switch-class">

<i class="bi bi-arrow-left"></i>
Switch Class

</a>

<button
onclick="logout()"
class="logout-link">

<i class="bi bi-box-arrow-right"></i>
Logout

</button>

</div>

</aside>


<main class="main-content">

<header class="topbar">

<div>

<h4>
Enter Student Marks
</h4>

<p>
Manually manage examination marks
</p>

</div>

<a
href="students.html"
class="btn btn-outline-primary">

<i class="bi bi-arrow-left"></i>
Back

</a>

</header>


<section class="content-area">

<div class="section-card">

<div class="student-summary">

<h4 id="studentNameDisplay">
Loading...
</h4>

<div class="student-summary-grid">

<span>
Roll No:
<strong id="studentRollDisplay">
-
</strong>
</span>

<span>
Email:
<strong id="studentEmailDisplay">
-
</strong>
</span>

<span>
Course:
<strong id="studentCourseDisplay">
-
</strong>
</span>

<span>
Semester:
<strong id="studentSemesterDisplay">
-
</strong>
</span>

</div>

</div>


<form id="marksForm">

<div class="section-header">

<div>

<h5>
Subjects & Marks
</h5>

<p>
Enter marks between 0 and 100.
</p>

</div>


<button
type="button"
class="btn btn-outline-primary"
id="addMarksSubject">

<i class="bi bi-plus-lg"></i>
Add Subject

</button>

</div>


<div id="marksContainer">

</div>


<div class="result-preview">

<div>

<span>
Total
</span>

<strong id="marksTotal">
0 / 0
</strong>

</div>

<div>

<span>
Percentage
</span>

<strong id="marksPercentage">
-
</strong>

</div>

<div>

<span>
Grade
</span>

<strong id="marksGrade">
-
</strong>

</div>

<div>

<span>
Result
</span>

<strong id="marksResult">
PENDING
</strong>

</div>

</div>


<div class="form-actions">

<a
href="students.html"
class="btn btn-light">

Cancel

</a>

<button
type="submit"
class="btn btn-primary">

<i class="bi bi-check-lg"></i>
Save Marks

</button>

</div>

</form>

</div>

</section>

</main>

</div>


<script
src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>

<script src="js/auth.js"></script>

<script src="js/app.js"></script>

<script>

$(document).ready(function () {

loadMarksPage();

});

</script>

</body>

</html>
