<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Add Student - Examination Portal</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="css/style.css">

</head>

<body>

<div class="portal-wrapper">

<aside class="sidebar">

<div class="brand">

<div class="brand-logo">
UE
</div>

<div>

<h5>
Examination Portal
</h5>

<small id="sidebarClassName">
Class
</small>

</div>

</div>


<nav class="sidebar-nav">

<a
href="index.html"
class="nav-link">

<i class="bi bi-grid-1x2"></i>
Dashboard

</a>

<a
href="students.html"
class="nav-link">

<i class="bi bi-people"></i>
Students

</a>

<a
href="add-student.html"
class="nav-link active">

<i class="bi bi-person-plus"></i>
Add Student

</a>

<a
href="upload-students.html"
class="nav-link">

<i class="bi bi-cloud-upload"></i>
Upload Student List

</a>

</nav>


<div class="sidebar-bottom">

<a
href="classes.html"
class="switch-class">

<i class="bi bi-arrow-left"></i>
Switch Class

</a>

<button
onclick="logout()"
class="logout-link">

<i class="bi bi-box-arrow-right"></i>
Logout

</button>

</div>

</aside>


<main class="main-content">

<header class="topbar">

<div>

<h4>
Add Student
</h4>

<p>
Add examination information
</p>

</div>

</header>


<section class="content-area">

<div class="section-card">

<div class="section-header">

<div>

<h5>
Student Information
</h5>

<p>
Class:
<strong id="selectedClassName"></strong>
</p>

</div>

</div>


<form id="studentForm">

<div class="row g-3">

<div class="col-md-6">

<label class="form-label">
Roll Number
</label>

<input
type="text"
id="rollNumber"
class="form-control"
placeholder="Enter roll number"
required>

</div>


<div class="col-md-6">

<label class="form-label">
Student Name
</label>

<input
type="text"
id="studentName"
class="form-control"
placeholder="Enter student name"
required>

</div>


<div class="col-md-6">

<label class="form-label">
Email
</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter email"
required>

</div>


<div class="col-md-3">

<label class="form-label">
Course
</label>

<input
type="text"
id="course"
class="form-control"
placeholder="B.Tech CSE"
required>

</div>


<div class="col-md-3">

<label class="form-label">
Semester
</label>

<input
type="number"
id="semester"
class="form-control"
min="1"
max="12"
placeholder="5"
required>

</div>

</div>


<hr class="my-4">


<div class="section-header">

<div>

<h5>
Subjects & Marks
</h5>

<p>
You can also add marks later from the Students section.
</p>

</div>


<button
type="button"
class="btn btn-outline-primary"
id="addSubject">

<i class="bi bi-plus-lg"></i>
Add Subject

</button>

</div>


<div id="subjectsContainer">

<div class="subject-row">

<input
type="text"
class="form-control subject-name"
placeholder="Subject name">

<input
type="number"
class="form-control subject-marks"
placeholder="Marks"
min="0"
max="100">

<button
type="button"
class="btn btn-outline-danger remove-subject">

<i class="bi bi-trash"></i>

</button>

</div>

</div>


<div class="result-preview">

<div>

<span>
Total Marks
</span>

<strong id="totalMarks">
0 / 0
</strong>

</div>


<div>

<span>
Percentage
</span>

<strong id="percentage">
-
</strong>

</div>


<div>

<span>
Grade
</span>

<strong id="grade">
-
</strong>

</div>


<div>

<span>
Result
</span>

<strong id="result">
PENDING
</strong>

</div>

</div>


<div class="form-actions">

<a
href="students.html"
class="btn btn-light">

Cancel

</a>

<button
type="submit"
class="btn btn-primary">

<i class="bi bi-check-lg"></i>
Save Student

</button>

</div>

</form>

</div>

</section>

</main>

</div>


<script
src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>

<script src="js/auth.js"></script>

<script src="js/app.js"></script>

<script>

$(document).ready(function () {

initializeAddStudent();

$("#sidebarClassName")
    .text(
        getSelectedClassName()
    );

});

</script>

</body>

</html>
