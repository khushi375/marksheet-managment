<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Select Class - Examination Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <div class="portal-wrapper">

        <aside class="sidebar">

            <div class="brand">

                <div class="brand-logo">
                    UE
                </div>

                <div>
                    <h5>Examination Portal</h5>
                    <small>Administration</small>
                </div>

            </div>


            <div class="sidebar-footer">

                <small>
                    University Examination Cell
                </small>

                <span>
                    Academic Portal
                </span>

            </div>

        </aside>


        <main class="main-content">

            <header class="topbar">

                <div>

                    <h4>
                        Select Class
                    </h4>

                    <p>
                        Choose a class to manage examination records
                    </p>

                </div>


                <button
                    class="btn btn-outline-danger"
                    onclick="logout()">

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </button>

            </header>


            <section class="content-area">

                <div class="section-header class-page-header">

                    <div>

                        <h5>
                            Your Classes
                        </h5>

                        <p>
                            Select a class to open its examination portal.
                        </p>

                    </div>


                    <button
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#addClassModal">

                        <i class="bi bi-plus-lg"></i>
                        Add Class

                    </button>

                </div>


                <div
                    id="classesContainer"
                    class="classes-grid">

                </div>

            </section>

        </main>

    </div>


    <div
        class="modal fade"
        id="addClassModal"
        tabindex="-1">

        <div
            class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Add New Class
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <label class="form-label">
                        Class Name
                    </label>

                    <input
                        type="text"
                        id="className"
                        class="form-control"
                        placeholder="e.g. B.Tech CSE - Semester 5">

                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button
                        class="btn btn-primary"
                        id="saveClass">

                        Save Class

                    </button>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/auth.js"></script>

    <script src="js/classes.js"></script>

</body>

</html>
