<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login - University Examination Cell</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <div class="login-logo">
                UE
            </div>

            <h2>
                University Examination Cell
            </h2>

            <p class="login-subtitle">
                Examination Management Portal
            </p>

            <form id="loginForm">

                <div class="mb-3">

                    <label>
                        Email Address
                    </label>

                    <div class="input-icon">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter admin email"
                            required>

                    </div>

                </div>


                <div class="mb-4">

                    <label>
                        Password
                    </label>

                    <div class="input-icon">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter password"
                            required>

                    </div>

                </div>


                <div
                    id="loginError"
                    class="alert alert-danger d-none">
                </div>


                <button
                    type="submit"
                    class="btn btn-primary login-button"
                    id="loginButton">

                    Login
                    <i class="bi bi-arrow-right"></i>

                </button>

            </form>


            <div class="login-footer">
                Authorized University Administrator
            </div>

        </div>

    </div>


    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <script>

        $(document).ready(function () {

            if (
                localStorage.getItem(
                    "examToken"
                )
            ) {

                window.location.href =
                    "classes.html";

                return;
            }


            $("#loginForm").submit(
                function (e) {

                    e.preventDefault();

                    const email =
                        $("#email")
                            .val()
                            .trim();

                    const password =
                        $("#password")
                            .val();

                    $("#loginError")
                        .addClass(
                            "d-none"
                        );


                    $("#loginButton")
                        .prop(
                            "disabled",
                            true
                        )
                        .html(
                            '<span class="spinner-border spinner-border-sm"></span> Signing in...'
                        );


                    $.ajax({

                        url:
                            "http://localhost:5000/api/auth/login",

                        method: "POST",

                        contentType:
                            "application/json",

                        data:
                            JSON.stringify({
                                email,
                                password
                            }),

                        success:
                            function (response) {

                                localStorage.setItem(
                                    "examToken",
                                    response.token
                                );

                                localStorage.setItem(
                                    "adminData",
                                    JSON.stringify(
                                        response.admin
                                    )
                                );

                                window.location.href =
                                    "classes.html";
                            },

                        error:
                            function (xhr) {

                                $("#loginButton")
                                    .prop(
                                        "disabled",
                                        false
                                    )
                                    .html(
                                        'Login <i class="bi bi-arrow-right"></i>'
                                    );

                                $("#loginError")
                                    .removeClass(
                                        "d-none"
                                    )
                                    .text(
                                        xhr.responseJSON?.message ||
                                        "Login failed"
                                    );
                            }
                    });

                }
            );

        });

    </script>

</body>

</html>
